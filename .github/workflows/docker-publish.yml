name: Docker Build and Publish

on:
  push:
    # The experimental mobile-api branch also builds, so it can be tested from
    # a dedicated image tag (ghcr.io/.../liebherr2mqtt:mobile-api) without ever
    # touching :latest, which stays pinned to main.
    branches: [ "main", "mobile-api" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # QEMU : émulation ARM sur les runners x86, pour la compilation multi-arch
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Buildx : le moteur capable de compiler en multi-arch
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # En plus du tag de branche, on publie "latest" sur la branche par
          # défaut : c'est ce tag que référence le gabarit Unraid.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # PC/NAS standard ET Raspberry Pi
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
